# /etc/nginx/conf.d/a-share-ai.conf 或宝塔 vhost 目录
# 证书路径按实际替换；当前默认用 IP 自签名证书。
server {
    listen 443 ssl default_server;
    server_name 210.16.170.229;

    ssl_certificate     /www/server/panel/vhost/cert/a-share-ip/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/a-share-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 2m;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600;
        proxy_send_timeout 3600;
    }
}
