<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0B1220">
  <meta name="description" content="智投罗盘 · AI 选股助手：在一个对话框里完成投资画像、因子选股、结果解读与模型优化。">
  <title>智投罗盘 · AI 选股助手</title>
  <link rel="stylesheet" href="style.css?v=7">
</head>
<body>
  <!-- 内联图标库：无字体、无 CDN、无第三方资源 -->
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-spark" viewBox="0 0 24 24"><path d="M12 2.8 13.7 9l6.2 1.7-6.2 1.8L12 18.7l-1.7-6.2L4 10.7 10.3 9 12 2.8Z"/><path d="m18.4 16.2.8 2.6 2.6.8-2.6.8-.8 2.6-.8-2.6-2.6-.8 2.6-.8.8-2.6Z"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M4.8 20.2a7.2 7.2 0 0 1 14.4 0"/></symbol>
    <symbol id="i-send" viewBox="0 0 24 24"><path d="m4 11.4 15.4-6.9a.7.7 0 0 1 .95.9L14.3 20.2a.7.7 0 0 1-1.3-.05l-1.8-5.1-5.1-1.9a.7.7 0 0 1-.1-1.75Z"/><path d="m11.2 14.4 4.2-4.2"/></symbol>
    <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.4"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.1"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="M12 2.8 20 6v5.2c0 4.8-3.2 8.2-8 10-4.8-1.8-8-5.2-8-10V6l8-3.2Z"/><path d="m8.6 12 2.2 2.2 4.6-4.6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m4.8 12.6 4.9 4.9L19.6 7"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3.4 21 19.6H3L12 3.4Z"/><path d="M12 9.4v4.4M12 16.6v.2"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 6.4v5.2h-5.2"/><path d="M19.1 11.6a7.4 7.4 0 1 0-1.5 6.1"/></symbol>
    <symbol id="i-pulse" viewBox="0 0 24 24"><path d="M3 12h3.8l2.1-5.2 4.2 10.4 2.1-5.2H21"/></symbol>
    <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3.8 12 8.2 4.5 8.2-4.5M3.8 16.2l8.2 4.5 8.2-4.5"/></symbol>
    <symbol id="i-code" viewBox="0 0 24 24"><path d="m8.4 7.5-5 4.5 5 4.5M15.6 7.5l5 4.5-5 4.5M13.6 5.4l-3.2 13.2"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h16"/><path d="m7.6 15.2 3.4-4.3 3 2.6 4.4-5.6"/></symbol>
    <symbol id="i-workbench" viewBox="0 0 24 24"><rect x="3.4" y="4" width="17.2" height="16" rx="2.4"/><path d="M9.6 4v16M9.6 9.6h11"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.4V12l3.1 1.9"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4.6 12h14.8M13.4 6l6 6-6 6"/></symbol>
    <symbol id="i-chev" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol>
    <symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M4 7h10M4 12h10M4 17h7"/><circle cx="18.4" cy="15.2" r="3.4"/><path d="M18.4 13.6v1.8l1.3.8"/></symbol>
  </svg>

  <div class="ambient" aria-hidden="true">
    <canvas id="fluid-canvas" class="fluid-canvas"></canvas>
    <span class="ambient-grain"></span>
  </div>

  <header class="topbar">
    <a class="brand" href="#" aria-label="智投罗盘 · AI 选股助手">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="16.5" fill="none" stroke="currentColor" stroke-width="1.2" opacity=".45"/><circle cx="20" cy="20" r="11.5" fill="none" stroke="currentColor" stroke-width=".8" opacity=".24"/><path d="m25.6 14.4-3 8.2-8.2 3 3-8.2 8.2-3Z" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="20" cy="20" r="1.8" fill="currentColor"/></svg>
      </span>
      <span class="brand-copy">
        <strong>智投罗盘</strong>
        <span>AI 选股助手</span>
      </span>
    </a>

    <div class="topbar-right">
      <button class="topbar-btn" id="new-chat" type="button" title="开启新对话">
        <svg class="icon"><use href="#i-plus"></use></svg><span>新对话</span>
      </button>
      <button class="topbar-btn" id="history-btn" type="button" title="历史对话归档">
        <svg class="icon"><use href="#i-history"></use></svg><span>历史对话</span>
      </button>
      <span class="ai-state-chip" id="ai-state-chip"><i></i><span>AI 正在工作 · 流体加速</span></span>
      <div class="health-pill" id="health-pill" title="后端与数据服务状态">
        <span class="health-dot is-loading" id="health-dot"></span>
        <span id="health-text">连接中</span>
      </div>
      <span class="session-chip" id="session-chip" title="浏览器本地会话">会话 —</span>
      <button class="wb-toggle" id="wb-toggle" type="button" aria-controls="workbench" aria-expanded="true">
        <svg class="icon"><use href="#i-workbench"></use></svg>
        <span id="wb-toggle-label">AI 工作台</span>
      </button>
    </div>
  </header>

  <main class="workspace" id="workspace">
    <section class="chat-panel" aria-label="AI 对话">
      <div class="chat-scroll" id="chat-scroll">
        <div class="chat-stream" id="chat-stream" aria-live="polite" aria-relevant="additions">
          <div class="chat-loading"><span class="spinner"></span>正在连接 AI 助手…</div>
        </div>
      </div>

      <form class="composer" id="composer">
        <div class="composer-box">
          <textarea id="composer-input" rows="1" maxlength="2000" placeholder="说说你的投资想法，例如：我想稳健一点，能接受 10% 左右回撤……"></textarea>
          <button class="send-btn" id="send-btn" type="submit" aria-label="发送消息">
            <svg class="icon"><use href="#i-send"></use></svg>
            <span>发送</span>
          </button>
        </div>
        <div class="composer-foot">
          <span class="composer-hint">Enter 发送 · Shift + Enter 换行</span>
          <span class="composer-tip">低风险操作确认后 AI 直接执行，重要变更会先请你审批</span>
        </div>
      </form>
    </section>

    <aside class="workbench" id="workbench" aria-label="AI 工作台">
      <div class="wb-scroll">
        <div class="wb-alert" id="wb-alert" hidden></div>
        <section class="wb-card" id="wb-profile"></section>
        <section class="wb-card" id="wb-activity"></section>
        <section class="wb-card" id="wb-model"></section>
        <section class="wb-card" id="wb-result"></section>
        <section class="wb-card wb-quick-card">
          <header class="wb-head">
            <span class="wb-kicker">SHORTCUTS</span>
            <h2>快捷入口</h2>
          </header>
          <div class="quick-list">
            <button class="quick-btn" type="button" data-action="quick" data-message="帮我优化模型">
              <svg class="icon"><use href="#i-spark"></use></svg><span>帮我优化模型</span>
            </button>
            <button class="quick-btn" type="button" data-action="quick" data-message="解释一下这次选股结果">
              <svg class="icon"><use href="#i-pulse"></use></svg><span>解读这次选股</span>
            </button>
            <button class="quick-btn" type="button" data-action="quick" data-message="帮我重新选一次股">
              <svg class="icon"><use href="#i-refresh"></use></svg><span>重新选股</span>
            </button>
            <button class="quick-btn" type="button" data-action="quick" data-message="我确认画像，开始帮我选股">
              <svg class="icon"><use href="#i-target"></use></svg><span>确认画像并选股</span>
            </button>
          </div>
          <p class="wb-note">点一下只是把这句话发进聊天，所有操作都由 AI 和你确认后完成。</p>
        </section>
      </div>
    </aside>
  </main>

  <div class="history-overlay" id="history-overlay" hidden>
    <div class="history-panel" role="dialog" aria-modal="true" aria-labelledby="history-title">
      <header class="history-head">
        <div>
          <h2 id="history-title">历史对话归档</h2>
          <p class="history-note">所有对话自动归档保存在本地服务端，可随时切回继续。</p>
        </div>
        <button class="icon-btn" id="history-close" type="button" aria-label="关闭历史对话">
          <svg class="icon"><use href="#i-close"></use></svg>
        </button>
      </header>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <footer class="app-footer">
    <p class="disclaimer">
      <svg class="icon"><use href="#i-shield"></use></svg>
      <span><strong>免责声明</strong> 本系统为比赛演示原型，仅用于技术方案展示与投资研究辅助，不构成投资建议，不承诺收益。历史回测不代表未来表现，市场有风险，投资需谨慎。</span>
    </p>
    <span class="footer-meta" id="footer-meta">数据加载中…</span>
  </footer>

  <script src="fluid.js?v=7"></script>
  <script src="charts.js?v=7"></script>
  <script src="app.js?v=7"></script>
</body>
</html>
